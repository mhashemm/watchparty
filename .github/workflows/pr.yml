name: pr
on:
  pull_request:
  # a PR can only read caches saved by itself or by master
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Download
        run: go mod download

      - name: Build
        run: make -j4 ${{ matrix.goos }}

      - name: Build the Windows installer
        if: matrix.goos == 'windows'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis && make setup

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          # a key of its own: the build jobs share the plain one, and the first to finish saves it
          cache-dependency-path: |
            go.sum
            e2e.Dockerfile

      - name: Download
        run: go mod download

      - name: Test
        timeout-minutes: 15
        run: make -j test

      - name: Test with random delays
        timeout-minutes: 15
        run: make e2e E2E="--jitter ${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Stress the unit tests
        timeout-minutes: 15
        run: go test -race -shuffle=on -count=10 -cpu=1,4 -tags disable_libutp ./...

      - name: Keep the e2e logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: .e2e
          include-hidden-files: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Download
        run: go mod download

      - name: Install mpv and ffmpeg
        # Chocolatey's mpv.exe on PATH is a shim that starts the real one, and killing
        # the shim leaves mpv running, so put the real mpv.exe's folder first
        run: |
          choco install -y --no-progress mpv ffmpeg nsis
          $mpv = Get-ChildItem C:\ProgramData\chocolatey\lib -Recurse -Filter mpv.exe | Select-Object -First 1
          $mpv.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Unit tests
        run: go test -race -tags disable_libutp ./...

      - name: E2E
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
        run: python e2e_windows.py
