name: publisher
on:
  workflow_dispatch:
  push:
    tags:
      - "**"

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  build:
    needs: release
    permissions:
      id-token: write
      contents: write
      actions: read
    runs-on: ubuntu-latest
    strategy:
      # one failed upload must not cancel the others mid-upload
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, out: watchparty_amd64, gui: watchparty-gui_amd64 }
          - { goos: linux, goarch: arm64, out: watchparty_arm64, gui: watchparty-gui_arm64 }
          - { goos: windows, goarch: amd64, out: watchparty.exe, gui: watchparty-gui.exe }
          - { goos: darwin, goarch: amd64, out: watchparty_mac_amd64, gui: watchparty-gui_mac_amd64 }
          - { goos: darwin, goarch: arm64, out: watchparty_mac_arm64, gui: watchparty-gui_mac_arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - name: Download
        run: go mod download

      - name: Build
        # the tag goes through env, never interpolated into the shell: a git tag may
        # legally contain backticks or $(), which would otherwise run in this step
        env:
          REF: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -ldflags="-s -w -X main.version=$REF" -o ${{ matrix.out }} .

      - name: Build gui
        # the tag goes through env, never interpolated into the shell: a git tag may
        # legally contain backticks or $(), which would otherwise run in this step
        env:
          REF: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -ldflags="-s -w -X main.version=$REF ${{ matrix.goos == 'windows' && '-H=windowsgui' || '' }}" -o ${{ matrix.gui }} ./gui

      - name: Build the Windows installer
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
          makensis -V2 -DEXE=$PWD/${{ matrix.gui }} -DOUT=$PWD/watchparty-gui-setup.exe gui/setup.nsi

      - name: Publish
        # GitHub's upload API has answered 404, 500 and 502 for minutes at a time. --clobber
        # makes a retry safe, including after a partial upload.
        run: |
          for delay in 30 60 90 120 0; do
            gh release upload "$GITHUB_REF_NAME" ${{ matrix.out }} ${{ matrix.gui }} ${{ matrix.goos == 'windows' && 'watchparty-gui-setup.exe' || '' }} --clobber && exit 0
            sleep "$delay"
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
