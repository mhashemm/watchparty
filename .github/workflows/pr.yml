name: pr
on:
  pull_request:
  # a PR can only read caches saved by itself or by master
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Download
        run: go mod download

      - name: Build
        run: make -j4 ${{ matrix.goos }}

      - name: Build the Windows installer
        if: matrix.goos == 'windows'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis && make setup

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Download
        run: go mod download

      - name: Unit tests
        timeout-minutes: 10
        run: go test -race -tags disable_libutp ./...

      # the plain run keeps seeds 0..N, which hold every order that once failed; this one
      # tries orders no run has tried, and a failure prints how to replay its seed
      - name: The party simulator on new seeds
        timeout-minutes: 10
        env:
          SIM_SEED: ${{ github.run_id }}${{ github.run_attempt }}
        run: go test -race -tags disable_libutp ./mpv

      # -short skips the simulator: a seed picks the same orders every time
      - name: Stress the unit tests
        timeout-minutes: 10
        run: go test -race -short -shuffle=on -count=10 -cpu=1,4 -tags disable_libutp ./...

  e2e:
    runs-on: ubuntu-latest
    strategy:
      # one phase failing says nothing about the others
      fail-fast: false
      matrix:
        phase: [p2p, relay, media, caps, gui, upnp]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          # a key of its own: the build jobs share the plain one, and the first to finish saves it
          cache-dependency-path: |
            go.sum
            e2e.Dockerfile

      - name: Download
        run: go mod download

      # each phase on a runner of its own, so no phase is slowed by another's mpv's and
      # browsers; --jitter delays the phases that support it and is ignored by the rest
      - name: E2E
        timeout-minutes: 15
        run: make e2e E2E="--mode ${{ matrix.phase }} --jitter ${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Keep the e2e logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.phase }}
          path: .e2e
          include-hidden-files: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Download
        run: go mod download

      - name: Install mpv and ffmpeg
        # Chocolatey's mpv.exe on PATH is a shim that starts the real one, and killing
        # the shim leaves mpv running, so put the real mpv.exe's folder first
        run: |
          choco install -y --no-progress mpv ffmpeg nsis
          $mpv = Get-ChildItem C:\ProgramData\chocolatey\lib -Recurse -Filter mpv.exe | Select-Object -First 1
          $mpv.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Unit tests
        run: go test -race -tags disable_libutp ./...

      - name: E2E
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
        run: python e2e_windows.py
