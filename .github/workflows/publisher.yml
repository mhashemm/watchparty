name: publisher
on:
  workflow_dispatch:
  push:
    tags:
      - "**"

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  build:
    needs: release
    permissions:
      id-token: write
      contents: write
      actions: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, out: watchparty_amd64, gui: watchparty-gui_amd64 }
          - { goos: linux, goarch: arm64, out: watchparty_arm64, gui: watchparty-gui_arm64 }
          - { goos: windows, goarch: amd64, out: watchparty.exe, gui: watchparty-gui.exe }
          - { goos: darwin, goarch: amd64, out: watchparty_mac_amd64, gui: watchparty-gui_mac_amd64 }
          - { goos: darwin, goarch: arm64, out: watchparty_mac_arm64, gui: watchparty-gui_mac_arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27.3"

      - name: Download
        run: go mod download

      - name: Build
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -o ${{ matrix.out }} .

      - name: Build gui
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -ldflags="-X main.version=${{ github.ref_name }} ${{ matrix.goos == 'windows' && '-H=windowsgui' || '' }}" -o ${{ matrix.gui }} ./gui

      - name: Publish
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.out }} ${{ matrix.gui }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
