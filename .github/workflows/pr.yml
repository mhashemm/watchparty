name: pr
on:
  pull_request:
  # a PR can only read caches saved by itself or by master
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    # the GUI builds only on its own OS (cgo), so macOS on a Mac
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux }
          - { runner: macos-latest, goos: darwin }
          - { runner: ubuntu-latest, goos: windows }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Download
        run: go mod download

      - name: Gio's headers
        if: matrix.goos == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: Build
        run: make -j4 ${{ matrix.goos }}

      - name: Build the Windows installer
        if: matrix.goos == 'windows'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis && make setup

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Download
        run: go mod download

      # the GUI's tests draw headless through Mesa (TestRender's path), and build with cgo
      - name: Gio's headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: Unit tests
        timeout-minutes: 10
        run: go test -race -tags disable_libutp ./...

      # the plain run keeps seeds 0..N, which hold every order that once failed; this one
      # tries orders no run has tried, and a failure prints how to replay its seed
      - name: The party simulator on new seeds
        timeout-minutes: 10
        env:
          SIM_SEED: ${{ github.run_id }}${{ github.run_attempt }}
        run: go test -race -tags disable_libutp ./mpv

      # -short skips the simulator: a seed picks the same orders every time
      - name: Stress the unit tests
        timeout-minutes: 10
        run: go test -race -short -shuffle=on -count=10 -cpu=1,4 -tags disable_libutp ./...

  e2e:
    runs-on: ubuntu-latest
    strategy:
      # one phase failing says nothing about the others
      fail-fast: false
      matrix:
        phase: [p2p, relay, media, caps, gui, upnp]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          # a key of its own: the build jobs share the plain one, and the first to finish saves it
          cache-dependency-path: |
            go.sum
            e2e.Dockerfile

      - name: Download
        run: go mod download

      # the image runs as the runner's user, as make e2e builds it
      - name: Runner user
        id: user
        run: echo "uid=$(id -u)" "gid=$(id -g)" | tr ' ' '\n' >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # its 1.9GB took 80s to build in every job; the layers now come from the Actions
      # cache, saved again only when e2e.Dockerfile changes
      - name: Build the e2e image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: e2e.Dockerfile
          tags: watchparty-e2e
          load: true
          build-args: |
            UID=${{ steps.user.outputs.uid }}
            GID=${{ steps.user.outputs.gid }}
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e

      # each phase on a runner of its own, so no phase is slowed by another's mpv's and
      # browsers; --jitter delays the phases that support it and is ignored by the rest
      - name: E2E
        timeout-minutes: 15
        run: make e2e E2E_IMAGE_BUILT=1 E2E="--mode ${{ matrix.phase }} --jitter ${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Keep the e2e logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.phase }}
          path: .e2e
          include-hidden-files: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Download
        run: go mod download

      - name: Install mpv and ffmpeg
        # Chocolatey's mpv.exe on PATH is a shim that starts the real one, and killing
        # the shim leaves mpv running, so put the real mpv.exe's folder first
        run: |
          choco install -y --no-progress mpv ffmpeg nsis
          $mpv = Get-ChildItem C:\ProgramData\chocolatey\lib -Recurse -Filter mpv.exe | Select-Object -First 1
          $mpv.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Unit tests
        run: go test -race -tags disable_libutp ./...

      - name: E2E
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
        run: python e2e_windows.py
