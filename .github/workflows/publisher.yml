name: publisher
on:
  workflow_dispatch:
  push:
    tags:
      - "**"

permissions: read-all

jobs:
  build:
    permissions:
      id-token: write
      contents: write
      actions: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, out: watchparty_amd64 }
          - { goos: linux, goarch: arm64, out: watchparty_arm64 }
          - { goos: windows, goarch: amd64, out: watchparty.exe }
          - { goos: darwin, goarch: amd64, out: watchparty_mac_amd64 }
          - { goos: darwin, goarch: arm64, out: watchparty_mac_arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26"

      - name: Tidy
        run: go mod tidy

      - name: Build
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -o ${{ matrix.out }} .

      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" ${{ matrix.out }} --generate-notes || gh release upload "$GITHUB_REF_NAME" ${{ matrix.out }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
