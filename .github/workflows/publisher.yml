name: publisher
on:
  workflow_dispatch:
  push:
    tags:
      - "**"

permissions: read-all

jobs:
  build:
    permissions:
      id-token: write
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26"

      - name: Tidy
        run: go mod tidy

      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -v -o watchparty_amd64 main.go

      - name: Build Linux arm64
        run: GOOS=linux GOARCH=arm64 go build -v -o watchparty_arm64 main.go

      - name: Build Windows
        run: GOOS=windows GOARCH=amd64 go build -v -o watchparty.exe main.go

      - name: Build Mac amd64
        run: GOOS=darwin GOARCH=amd64 go build -v -o watchparty_mac_amd64 main.go

      - name: Build Mac arm64
        run: GOOS=darwin GOARCH=arm64 go build -v -o watchparty_mac_arm64 main.go

      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" watchparty_amd64 watchparty_arm64 watchparty.exe watchparty_mac_amd64 watchparty_mac_arm64 --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
